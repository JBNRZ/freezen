# freezen configuration. Every field is optional; the value shown is the
# default, so an empty file (or no file at all) serves on :8080 with no proxy.
#
# Pass this file with:  freezen -c config.yaml

# Address to listen on.
addr: ":8080"

# What every upstream request to Zen is signed with. Zen's free tier answers
# the public credential, so the default works without an account.
api_key: "public"

# The one proxy a request is sent through. Empty (the default) means a direct
# connection. It is an http://, https:// or socks5:// URL; a bare host:port is
# read as http:// and a URL may carry credentials (http://user:pass@host:port).
# Only one may be named: a list is refused. When the proxy fails to carry a
# request, that request is made again over a direct connection.
proxy: ""
# proxy: "socks5://127.0.0.1:1080"

# How much to log: debug, info, warn or error.
log_level: "info"
